<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/webp"
      href="{{ url_for('static', filename='logo.webp') }}"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LegalPlain — SignUp</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/signup_styles.css') }}"
    />
  </head>

  <body>
    <div class="center-box">
      <div class="tab-header">
        <button type="button" class="active" id="tab-signup">Sign Up</button>
      </div>
      <form class="signup-form" id="signup-form">
        <div id="success-message" class="success-message"></div>
        <div id="error-message" class="error-message"></div>
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="text"
            id="phone"
            name="phone"
            pattern="^[0-9+\- ]{9,18}$"
            required
          />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Set Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            pattern="(?=^.{8,}$)((?=.*\d)|(?=.*\W+))(?![.\n])(?=.*[A-Z])(?=.*[a-z]).*$"
            title="Must contain at least one number and one uppercase and lowercase letter and one symbol, and at least 8 or more characters"
            required
          />
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            autocomplete="new-password"
            pattern="(?=^.{8,}$)((?=.*\d)|(?=.*\W+))(?![.\n])(?=.*[A-Z])(?=.*[a-z]).*$"
            required
          />
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="terms" required />
          <label for="terms"
            >I have accepted the
            <a href="#" class="terms-link">terms and conditions</a></label
          >
        </div>
        <button type="submit" class="signup-btn">Login Now</button>
      </form>
    </div>
    <script>
      document.getElementById("signup-form").onsubmit = async function (e) {
        e.preventDefault();
        let errorMsg = document.getElementById("error-message");
        let successMsg = document.getElementById("success-message");
        errorMsg.style.display = successMsg.style.display = "none";
        const fullname = document.getElementById("fullname").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const confirmPassword = document
          .getElementById("confirm-password")
          .value.trim();
        const termsChecked = document.getElementById("terms").checked;

        if (password !== confirmPassword) {
          errorMsg.textContent = "Passwords do not match.";
          errorMsg.style.display = "block";
          return;
        }
        if (!termsChecked) {
          errorMsg.textContent = "You must accept the terms and conditions.";
          errorMsg.style.display = "block";
          return;
        }

        try {
          const response = await fetch("/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fullname, phone, email, password }),
          });
          const result = await response.json();
          if (result.success) {
            successMsg.textContent = "Account created! You can now log in.";
            successMsg.style.display = "block";
            const previousUrl = document.referrer;

            setTimeout(() => {
              window.location.href = previousUrl;
            }, 1000);
            
          } else {
            errorMsg.textContent = result.error || "Sign up failed.";
            errorMsg.style.display = "block";
          }
        } catch (e) {
          errorMsg.textContent = "Could not register. Try again later.";
          errorMsg.style.display = "block";
        }
      };
    </script>
  </body>
</html>
